<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6aafe1">
  <title>Sunboy Blinds — Tampa Bay Window Treatment Experts</title>
  <meta name="description" content="#1 Window Treatment Experts for the Tampa Bay area. Meet Sunboy Blinds.">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="navbar">
    <a class="logo" href="/" aria-label="Sunboy Blinds home"><img src="/assets/sunboy-logo.png" alt="Sunboy Blinds" width="1408" height="684"></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button class="nav-item" data-open-info="treatments">Indoor / Outdoor</button>
      <button class="nav-item" data-open-info="about">About</button>
      <button class="nav-item" data-open-info="service-area">Service Area</button>
    </nav>
    <button class="sunboy-button" data-open-film>See it in action</button>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav"><span></span><span></span></button>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" hidden>
      <button class="nav-item" data-open-info="treatments">Indoor / Outdoor</button>
      <button class="nav-item" data-open-info="about">About</button>
      <button class="nav-item" data-open-info="service-area">Service Area</button>
    </nav>
  </header>
  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <picture class="hero-poster"><source media="(max-width: 700px)" srcset="/assets/hero-mobile.webp"><img src="/assets/hero-desktop.webp" alt="" width="1280" height="720" fetchpriority="high"></picture>
      <video class="hero-video" id="hero-video" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1 id="hero-title"><span>#1 Window Treatment Experts</span> <span>for the Tampa Bay area.</span></h1>
        <div class="hero-actions">
          <button class="sunboy-button consultation-button" id="consultation-button" disabled>Book a Consultation</button>
          <button class="call-button" id="call-button" disabled>Call Sunboy</button>
        </div>
        <div class="review-badges" aria-label="Customer reviews">
          <div class="review-badge" id="google-reviews" role="img" aria-label="Google five-star review badge">
            <span class="review-logo google-mark" aria-hidden="true">G</span>
            <span class="review-detail"><span class="review-name">Google reviews</span><span class="stars" aria-hidden="true">★★★★★</span></span>
          </div>
          <div class="review-badge" id="facebook-reviews" role="img" aria-label="Facebook five-star review badge">
            <span class="review-logo facebook-mark" aria-hidden="true">f</span>
            <span class="review-detail"><span class="review-name">Facebook reviews</span><span class="stars" aria-hidden="true">★★★★★</span></span>
          </div>
        </div>
      </div>
      <div class="hero-bottom"><button class="motion-control" id="motion-control" aria-label="Play background video" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span id="motion-label">Play video</span></button></div>
    </section>
  </main>
  <footer><span>Sunboy Blinds</span><a href="/accessibility/">Accessibility</a></footer>
  <dialog id="film-dialog" aria-labelledby="film-title">
    <div class="film-heading"><h2 id="film-title">Sunboy in action.</h2><button id="close-film" aria-label="Close film"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <video id="full-film" controls playsinline preload="none" poster="/assets/hero-desktop.webp" aria-label="Window shades in a kitchen, living room and dining room"></video>
    <p>Window shades in a kitchen, living room and dining room. This film has no sound.</p>
  </dialog>
  <dialog class="info-dialog" id="info-dialog" aria-labelledby="info-title">
    <div class="film-heading"><h2 id="info-title"></h2><button id="close-info" aria-label="Close details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="info-content"></div>
  </dialog>
</body>
</html>
